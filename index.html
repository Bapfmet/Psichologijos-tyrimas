<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psichologinis tyrimas: Mąstymo procesai ir patarlės</title>

    <!-- jsPsych biblioteka ir stiliai -->
    <script src="https://unpkg.com/jspsych@7.3.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-survey-text@1.1.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-survey-likert@1.1.3"></script>
    <link href="https://unpkg.com/jspsych@7.3.3/css/jspsych.css" rel="stylesheet" type="text/css" />
</head>
<body>
    <script>
        const jsPsych = initJsPsych({
            on_finish: function() {
                // Surinkome duomenis iš atskirų klausimų
                const surveyTextTrials = jsPsych.data.get().filter({trial_type: 'survey-text'}).values();
                const surveyLikertTrial = jsPsych.data.get().filter({trial_type: 'survey-likert'}).values()[0];

                const q1_ans = surveyTextTrials[0]?.response?.crt_1 || '';
                const q1_time = surveyTextTrials[0]?.rt || 0;

                const q2_ans = surveyTextTrials[1]?.response?.crt_2 || '';
                const q2_time = surveyTextTrials[1]?.rt || 0;

                const q3_ans = surveyTextTrials[2]?.response?.crt_3 || '';
                const q3_time = surveyTextTrials[2]?.rt || 0;

                const q4_ans = surveyLikertTrial?.response?.Q0 ?? '';
                const q5_ans = surveyLikertTrial?.response?.Q1 ?? '';

                // Atvaizduojame rezultatus norimu formatu
                document.body.innerHTML = `
                    <div style="font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 25px; background: #ffffff; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
                        <h2>Tyrimo rezultatai</h2>
                        <hr style="border: 0; border-top: 1px solid #eee; margin-bottom: 20px;">
                        
                        <p><strong>1 klausimas (Atsakymas):</strong> ${q1_ans}</p>
                        <p><strong>1 klausimo laikas:</strong> ${q1_time} ms</p>
                        
                        <p><strong>2 klausimas (Atsakymas):</strong> ${q2_ans}</p>
                        <p><strong>2 klausimo laikas:</strong> ${q2_time} ms</p>
                        
                        <p><strong>3 klausimas (Atsakymas):</strong> ${q3_ans}</p>
                        <p><strong>3 klausimo laikas:</strong> ${q3_time} ms</p>
                        
                        <p><strong>4 klausimas answer:</strong> ${q4_ans}</p>
                        <p><strong>5 klausimas answer:</strong> ${q5_ans}</p>
                    </div>
                `;
            }
        });

        let timeline = [];

        // 1. Sveikinimas
        timeline.push({
            type: jsPsychHtmlButtonResponse,
            stimulus: `
                <h2>Sveiki atvykę į tyrimą!</h2>
                <p>Šio tyrimo metu nagrinėsime sprendimų priėmimo ir mąstymo ypatumus.</p>
                <p>Prašome atsakyti į užduotis kuo greičiau ir tiksliau.</p>
            `,
            choices: ['Pradėti']
        });

        // 2. Tyrimo etika ir anonimiškumas (Informed Consent)
        timeline.push({
            type: jsPsychHtmlButtonResponse,
            stimulus: `
                <h3>Tyrimo etika ir duomenų konfidencialumas</h3>
                <p>Šis tyrimas yra <b>visiškai anoniminis</b>. Jūsų pateikti atsakymai bus naudojami tik apibendrintiems mokslo ar studijų tyrimo rezultatams gauti.</p>
                <p>Dalyvavimas tyrime yra savanoriškas. Jūs turite teisę bet kuriuo metu nutraukti dalyvavimą be jokių neigiamų pasekmių.</p>
                <p>Spausdami „Sutinku ir pradedu“, patvirtinate, kad susipažinote su informacija ir sutinkate dalyvauti tyrime.</p>
            `,
            choices: ['Sutinku ir pradedu']
        });

        // 3. CRT Instrukcija
        timeline.push({
            type: jsPsychHtmlButtonResponse,
            stimulus: `
                <h3>I dalis: Loginiai uždaviniai</h3>
                <p>Jums bus pateikti 3 trumpi klausimai. Atsakykite į juos įrašydami skaičių.</p>
            `,
            choices: ['Tęsti']
        });

        // CRT Q1 (Lazda ir kamuoliukas)
        timeline.push({
            type: jsPsychSurveyText,
            questions: [
                {
                    prompt: '<b>1.</b> Lazda ir kamuoliukas kartu kainuoja 1,10 Eur. Lazda kainuoja 1 Eur daugiau nei kamuoliukas. Kiek kainuoja kamuoliukas? (centais, pvz.: 5)',
                    name: 'crt_1',
                    required: true
                }
            ],
            button_label: 'Kitas klausimas'
        });

        // CRT Q2 (Mašinos ir detalės)
        timeline.push({
            type: jsPsychSurveyText,
            questions: [
                {
                    prompt: '<b>2.</b> Jei 5 mašinoms reikia 5 minučių pagaminti 5 detales, per kiek laiko 100 mašinų pagamins 100 detalių? (minutėmis)',
                    name: 'crt_2',
                    required: true
                }
            ],
            button_label: 'Kitas klausimas'
        });

        // CRT Q3 (Lelijos ežere)
        timeline.push({
            type: jsPsychSurveyText,
            questions: [
                {
                    prompt: '<b>3.</b> Ežere auga lelijų lapai. Kasdien jų plotas padvigubėja. Jei visas ežeras užauga per 48 dienas, per kiek laiko užaugs pusė ežero? (dienomis)',
                    name: 'crt_3',
                    required: true
                }
            ],
            button_label: 'Tęsti II dalį'
        });

        // 4. Patarlės analizės dalis
        timeline.push({
            type: jsPsychHtmlButtonResponse,
            stimulus: `
                <h3>II dalis: Patarlės vertinimas</h3>
                <p>Perskaitykite lietuvių liaudies patarlę: <b>„Viltis – kvailių motina“</b>.</p>
                <p>Kaip vertinate šį teiginį remdamiesi savo kasdiene patirtimi ir racionaliu mąstymu?</p>
            `,
            choices: ['Tęsti vertinimą']
        });

        // Likert skaitinė skalė patarlės prasmei vertinti
        timeline.push({
            type: jsPsychSurveyLikert,
            questions: [
                {
                    prompt: 'Viltis dažnai trukdo priimti racionalius, objektyviais faktais pagrįstus sprendimus (Sistemos 1 dominavimas).',
                    labels: ['Visiškai nesutinku', 'Nesutinku', 'Neutraliai', 'Sutinku', 'Visiškai sutinku'],
                    required: true
                },
                {
                    prompt: 'Viltis yra pozityvus psichologinis mechanizmas, padedantis išgyventi krizes, nepaisant šalto analitinio vertinimo (Sistemos 2 alternatyva).',
                    labels: ['Visiškai nesutinku', 'Nesutinku', 'Neutraliai', 'Sutinku', 'Visiškai sutinku'],
                    required: true
                }
            ],
            button_label: 'Baigti tyrimą'
        });

        // 5. Ačiū už dalyvavimą ekranas
        timeline.push({
            type: jsPsychHtmlButtonResponse,
            stimulus: `
                <h2>Ačiū už dalyvavimą!</h2>
                <p>Jūsų atsakymai sėkmingai užregistruoti. Dėkojame, kad skyrėte laiko šiam tyrimui.</p>
                <p>Paspauskite mygtuką „Baigti“, kad pamatytumėte surinktus duomenis.</p>
            `,
            choices: ['Baigti']
        });

        jsPsych.run(timeline);
    </script>
</body>
</html>
