<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psichologinis tyrimas: Mąstymo procesai ir patarlės</title>
    
    <!-- jsPsych biblioteka ir stiliai -->
    <script src="https://unpkg.com/jspsych@7.3.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-survey-text@1.1.3"></script>
    <link href="https://unpkg.com/jspsych@7.3.3/css/jspsych.css" rel="stylesheet" type="text/css" />
</head>
<body>
    <script>
        // 1. Inicializuojame jsPsych
        const jsPsych = initJsPsych({
            on_finish: function() {
                jsPsych.data.displayData('json');
            }
        });

        let timeline = [];

        // Pradinis sveikinimo ekranas
        let welcome = {
            type: jsPsychHtmlButtonResponse,
            stimulus: `
                <h2>Sveiki atvykę į tyrimą!</h2>
                <p>Šio tyrimo metu analizuosime sprendimų priėmimo greitį ir mąstymo ypatumus.</p>
                <p>Prašome atsakyti į kelis klausimus kuo greičiau, bet tiksliai.</p>
            `,
            choices: ['Pradėti']
        };
        timeline.push(welcome);

        // Instrukcija prieš CRT
        let crt_instruction = {
            type: jsPsychHtmlButtonResponse,
            stimulus: `
                <h3>Pirma užduotis</h3>
                <p>Perskaitykite žemiau pateiktą uždavinį ir įrašykite savo atsakymą skaičiumi.</p>
            `,
            choices: ['Tęsti']
        };
        timeline.push(crt_instruction);

        // CRT 1 klausimas (Lazda ir kamuoliukas)
        let crt_q1 = {
            type: jsPsychSurveyText,
            questions: [
                {
                    prompt: '<b>Lazda ir kamuoliukas kartu kainuoja 1,10 Eur.</b><br>Lazda kainuoja 1 Eur <b>daugiau</b> nei kamuoliukas.<br>Kiek kainuoja kamuoliukas? (Įrašykite sumą centais, pvz.: 5 arba 10)',
                    name: 'crt_bat_ball',
                    required: true
                }
            ],
            button_label: 'Pateikti atsakymą'
        };
        timeline.push(crt_q1);

        // Paleidžiame tyrimą
        jsPsych.run(timeline);
    </script>
</body>
</html>
