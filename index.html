<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psichologinis tyrimas: Mąstymo procesai</title>

    <!-- jsPsych biblioteka ir stiliai -->
    <script src="https://unpkg.com/jspsych@7.3.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-survey-text@1.1.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-survey-likert@1.1.3"></script>
    <link href="https://unpkg.com/jspsych@7.3.3/css/jspsych.css" rel="stylesheet" type="text/css" />
</head>
<body>
    <script>
        const jsPsych = initJsPsych({
            on_finish: function() {
                // Surinkome duomenis iš atskirų klausimų
                const surveyTextTrials = jsPsych.data.get().filter({trial_type: 'survey-text'}).values();
                const surveyLikertTrial = jsPsych.data.get().filter({trial_type: 'survey-likert'}).values()[0];

                const q1_ans = surveyTextTrials[0]?.response?.crt_1 || '';
                const q1_time = surveyTextTrials[0]?.rt || 0;

                const q2_ans = surveyTextTrials[1]?.response?.crt_2 || '';
                const q2_time = surveyTextTrials[1]?.rt || 0;

                const q3_ans = surveyTextTrials[2]?.response?.crt_3 || '';
                const q3_time = surveyTextTrials[2]?.rt || 0;

                const q4_ans = surveyTextTrials[3]?.response?.crt_4 || '';
                const q4_time = surveyTextTrials[3]?.rt || 0;

                const q5_ans = surveyTextTrials[4]?.response?.crt_5 || '';
                const q5_time = surveyTextTrials[4]?.rt || 0;

                const q6_ans = surveyTextTrials[5]?.response?.crt_6 || '';
                const q6_time = surveyTextTrials[5]?.rt || 0;

                const q7_ans = surveyTextTrials[6]?.response?.crt_7 || '';
                const q7_time = surveyTextTrials[6]?.rt || 0;

                const q8_ans = surveyTextTrials[7]?.response?.crt_8 || '';
                const q8_time = surveyTextTrials[7]?.rt || 0;

                const q9_ans = surveyTextTrials[8]?.response?.crt_9 || '';
                const q9_time = surveyTextTrials[8]?.rt || 0;

                const q10_ans = surveyTextTrials[9]?.response?.crt_10 || '';
                const q10_time = surveyTextTrials[9]?.rt || 0;

                const confidence_ans = surveyLikertTrial?.response?.confidence ?? '';

                // Atvaizduojame rezultatus norimu formatu
                document.body.innerHTML = `
                    <div style="font-family: Arial, sans-serif; max-width: 650px; margin: 40px auto; padding: 25px; background: #ffffff; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
                        <h2>Tyrimo rezultatai</h2>
                        <hr style="border: 0; border-top: 1px solid #eee; margin-bottom: 20px;">
                        
                        <p><strong>1 klausimas (Lazda ir kamuoliukas):</strong> ${q1_ans} (Laikas: ${q1_time} ms)</p>
                        <p><strong>2 klausimas (Mašinos ir detalės):</strong> ${q2_ans} (Laikas: ${q2_time} ms)</p>
                        <p><strong>3 klausimas (Ežero lelijos):</strong> ${q3_ans} (Laikas: ${q3_time} ms)</p>
                        <p><strong>4 klausimas (Plytos svoris):</strong> ${q4_ans} (Laikas: ${q4_time} ms)</p>
                        <p><strong>5 klausimas (Darbininkai ir duobės):</strong> ${q5_ans} (Laikas: ${q5_time} ms)</p>
                        <p><strong>6 klausimas (Bėgimo lenktynės):</strong> ${q6_ans} (Laikas: ${q6_time} ms)</p>
                        <p><strong>7 klausimas (Namas ir lokys):</strong> ${q7_ans} (Laikas: ${q7_time} ms)</p>
                        <p><strong>8 klausimas (Monetos kišenėje):</strong> ${q8_ans} (Laikas: ${q8_time} ms)</p>
                        <p><strong>9 klausimas (Ūkininko ūkio avys):</strong> ${q9_ans} (Laikas: ${q9_time} ms)</p>
                        <p><strong>10 klausimas (Kojinės tamsoje):</strong> ${q10_ans} (Laikas: ${q10_time} ms)</p>
                        
                        <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
                        <p><strong>11 klausimas (Pasitikėjimas savimi / viltis):</strong> ${confidence_ans} (skalėje nuo 1 iki 7)</p>
                    </div>
                `;
            }
        });

        let timeline = [];

        // 1. Sveikinimas
        timeline.push({
            type: jsPsychHtmlButtonResponse,
            stimulus: `
                <h2>Sveiki atvykę į tyrimą!</h2>
                <p>Šio tyrimo metu nagrinėsime sprendimų priėmimo ir mąstymo ypatumus.</p>
                <p>Prašome atsakyti į užduotis kuo greičiau ir tiksliau.</p>
            `,
            choices: ['Pradėti']
        });

        // 2. Tyrimo etika ir anonimiškumas (Informed Consent)
        timeline.push({
            type: jsPsychHtmlButtonResponse,
            stimulus: `
                <h3>Tyrimo etika ir duomenų konfidencialumas</h3>
                <p>Šis tyrimas yra <b>visiškai anoniminis</b>. Jūsų pateikti atsakymai bus naudojami tik apibendrintiems mokslo ar studijų tyrimo rezultatams gauti.</p>
                <p>Dalyvavimas tyrime yra savanoriškas. Jūs turite teisę bet kuriuo metu nutraukti dalyvavimą be jokių neigiamų pasekmių.</p>
                <p>Spausdami „Sutinku ir pradedu“, patvirtinate, kad susipažinote su informacija ir sutinkate dalyvauti tyrime.</p>
            `,
            choices: ['Sutinku ir pradedu']
        });

        // 3. Instrukcija
        timeline.push({
            type: jsPsychHtmlButtonResponse,
            stimulus: `
                <h3>Loginiai uždaviniai</h3>
                <p>Jums bus pateikti 10 trumpų klausimų. Atsakykite į juos įrašydami atitinkamą atsakymą.</p>
            `,
            choices: ['Tęsti']
        });

        // Q1 (Lazda ir kamuoliukas)
        timeline.push({
            type: jsPsychSurveyText,
            questions: [
                {
                    prompt: '<b>1. Lazda ir kamuoliukas</b><br>Lazda ir kamuoliukas kartu kainuoja 1,10 Eur. Lazda kainuoja 1 Eur daugiau už kamuoliuką. Kiek kainuoja kamuoliukas?',
                    name: 'crt_1',
                    required: true
                }
            ],
            button_label: 'Kitas klausimas'
        });

        // Q2 (Mašinos ir detalės)
        timeline.push({
            type: jsPsychSurveyText,
            questions: [
                {
                    prompt: '<b>2. Mašinos ir detalės</b><br>Jei 5 mašinoms reikia 5 minučių pagaminti 5 detales, per kiek laiko 100 mašinų pagamins 100 detalių? ',
                    name: 'crt_2',
                    required: true
                }
            ],
            button_label: 'Kitas klausimas'
        });

        // Q3 (Ežero lelijos)
        timeline.push({
            type: jsPsychSurveyText,
            questions: [
                {
                    prompt: '<b>3. Ežero lelijos</b><br>Ežere auga lelijų lapai. Kasdien jų plotas padvigubėja. Jei visas ežeras užauga per 48 dienas, per kiek laiko užaugs pusė ežero? ',
                    name: 'crt_3',
                    required: true
                }
            ],
            button_label: 'Kitas klausimas'
        });

        // Q4 (Plytos svoris)
        timeline.push({
            type: jsPsychSurveyText,
            questions: [
                {
                    prompt: '<b>4. Plytos svoris</b><br>Plyta sveria 1 kilogramą ir dar pusę savo svorio. Kiek sveria visa plyta? ',
                    name: 'crt_4',
                    required: true
                }
            ],
            button_label: 'Kitas klausimas'
        });

        // Q5 (Darbininkai ir duobės)
        timeline.push({
            type: jsPsychSurveyText,
            questions: [
                {
                    prompt: '<b>5. Darbininkai ir duobės</b><br>Jeigu 5 vyrai per 5 dienas iškasa 5 duobes, per kiek laiko 1 vyras iškastų 1 duobę?',
                    name: 'crt_5',
                    required: true
                }
            ],
            button_label: 'Kitas klausimas'
        });

        // Q6 (Bėgimo lenktynės)
        timeline.push({
            type: jsPsychSurveyText,
            questions: [
                {
                    prompt: '<b>6. Bėgimo lenktynės</b><br>Jei bėgate bėgimo lenktynėse ir aplenkiate žmogų, kuris bėga antroje vietoje, kelintoje vietoje dabar esate jūs?',
                    name: 'crt_6',
                    required: true
                }
            ],
            button_label: 'Kitas klausimas'
        });

        // Q7 (Namas ir lokys)
        timeline.push({
            type: jsPsychSurveyText,
            questions: [
                {
                    prompt: '<b>7. Namas ir lokys</b><br>Vyras pasistatė namą, kurio visi keturi langai žiūri į pietus. Pro šalį praėjo didelis rudas lokys. Kokios spalvos buvo lokys?',
                    name: 'crt_7',
                    required: true
                }
            ],
            button_label: 'Kitas klausimas'
        });

        // Q8 (Monetos kišenėje)
        timeline.push({
            type: jsPsychSurveyText,
            questions: [
                {
                    prompt: '<b>8. Monetos kišenėje</b><br>Jūsų kišenėje yra dvi monetas, kurių bendra suma yra 55 centai. Žinoma, kad viena iš jų nėra 5 centų moneta. Kokios tai moneta (-os)?',
                    name: 'crt_8',
                    required: true
                }
            ],
            button_label: 'Kitas klausimas'
        });

        // Q9 (Ūkininko ūkio avys)
        timeline.push({
            type: jsPsychSurveyText,
            questions: [
                {
                    prompt: '<b>9. Ūkininko ūkio avys</b><br>Ūkininkas turėjo 15 avių. Visi gyvuliai, išskyrus 8, sugaišo / nugaišo. Kiek avių jam liko gyvų? (parašykite skaičių)',
                    name: 'crt_9',
                    required: true
                }
            ],
            button_label: 'Kitas klausimas'
        });

        // Q10 (Kojinės tamsoje)
        timeline.push({
            type: jsPsychSurveyText,
            questions: [
                {
                    prompt: '<b>10. Kojinės tamsoje</b><br>Tamsiame stalčiuje sumaišytos 10 juodų ir 10 baltų kojinių. Kiek mažiausiai kojinių reikia ištraukti aklai, kad būtumėte visiškai užtikrinti, jog turite bent vieną porą vienos spalvos kojinių? (parašykite skaičių)',
                    name: 'crt_10',
                    required: true
                }
            ],
            button_label: 'Tęsti įvertinimą'
        });

        // 11. Galutinis pasitikėjimo savimi įvertinimas
        timeline.push({
            type: jsPsychSurveyLikert,
            questions: [
                {
                    prompt: '<b>11. Galutinis pasitikėjimo savimi įvertinimas</b><br>Kaip užtikrintas (-a) savo pateiktais atsakymais jautėtės per visą šio tyrimo eigą?<br><small>1 – Visiškai nepasitikėjau (abejojau beveik kiekvienu atsakymu) | 4 – Vidutiniškai | 7 – Visiškai pasitikėjau</small>',
                    labels: ['1', '2', '3', '4', '5', '6', '7'],
                    required: true,
                    name: 'confidence'
                }
            ],
            button_label: 'Baigti tyrimą'
        });

        // 12. Ačiū už dalyvavimą ekranas
        timeline.push({
            type: jsPsychHtmlButtonResponse,
            stimulus: `
                <h2>Ačiū už dalyvavimą!</h2>
                <p>Jūsų atsakymai sėkmingai užregistruoti. Dėkojame, kad skyrėte laiko šiam tyrimui.</p>
                <p>Paspauskite mygtuką „Baigti“, kad pamatytumėte surinktus duomenis.</p>
            `,
            choices: ['Baigti']
        });

        jsPsych.run(timeline);
    </script>
</body>
</html>
